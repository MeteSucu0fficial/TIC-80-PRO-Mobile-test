name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Library (CMake)
        run: |
          mkdir -p build
          cd build
          cmake -DBUILD_PRO=ON -DANDROID=ON -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake ..
          make

      - name: Build APK (Gradle)
        run: |
          # Eğer ana dizinde android klasörü varsa burası çalışır
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug
          fi

      - name: Upload Everything
        uses: actions/upload-artifact@v4
        with:
          name: TIC80-Full-Build
          path: |
            build/
            android/app/build/outputs/apk/
