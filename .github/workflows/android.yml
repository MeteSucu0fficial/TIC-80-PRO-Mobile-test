- name: Fix CMake Path and Inject Flags Safely
        run: |
          python3 -c "
          import os, re
          content = open('android/app/build.gradle').read()
          workspace = os.environ.get('GITHUB_WORKSPACE', '')
          
          # CMake yolunu düzelt
          content = re.sub(r'path\s+[\'\"].*?CMakeLists\.txt[\'\"]', f'path \"{workspace}/CMakeLists.txt\"', content)
          
          # Editörsüz, Sadece Oyuncu Modu için Argümanlar
          args = '-DBUILD_PRO=ON\", \"-DBUILD_EDITORS=OFF\", \"-DBUILD_SURF=OFF\", \"-DBUILD_NET=OFF\", \"-DBUILD_PLAYER=ON\", \"-DBUILD_WITH_JANET=OFF\", \"-DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON'
          
          # Ayarları en alta ekle
          content += f'''
          android {{
              defaultConfig {{
                  ndk {{ abiFilters \"arm64-v8a\" }}
                  externalNativeBuild {{
                      cmake {{ arguments \"{args}\" }}
                  }}
              }}
              buildTypes {{
                  release {{
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }}
              }}
          }}
          '''
          open('android/app/build.gradle', 'w').write(content)
          "
