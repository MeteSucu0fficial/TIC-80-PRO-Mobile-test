name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Fix CMake Path and Inject Flags
        run: |
          python3 -c "
          import os, re
          content = open('android/app/build.gradle').read()
          workspace = os.environ.get('GITHUB_WORKSPACE', '')
          
          # 1. CMake yolunu GitHub Actions kök dizinine sabitliyoruz
          content = re.sub(r'path\s+[\'\"].*?CMakeLists\.txt[\'\"]', f'path \"{workspace}/CMakeLists.txt\"', content)
          
          # 2. PRO bayrağını açıp, sorun çıkaran Janet motorunu kapatıyoruz
          if '-DBUILD_PRO=ON' not in content:
              content = content.replace('cmake {', 'cmake {\n                arguments \"-DBUILD_PRO=ON\", \"-DBUILD_WITH_JANET=OFF\"')
          
          open('android/app/build.gradle', 'w').write(content)
          "
          # Yaptığımız değişikliği kontrol etmek için loglayalım
          echo "Güncellenmiş Gradle Konfigürasyonu:"
          cat android/app/build.gradle | grep -A 3 "cmake {"

      - name: Prepare Assets
        run: |
          mkdir -p build/assets
          cp -r assets/* build/assets/ || true
          mkdir -p android/app/build/assets
          cp -r assets/* android/app/build/assets/ || true

      - name: Build APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Find and Upload ANY APK
        uses: actions/upload-artifact@v4
        with:
          name: TIC80-Pro-APK
          path: '**/*.apk'
