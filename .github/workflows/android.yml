name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Patch Build Files
        run: |
          # 1. CMakeLists.txt dosyasının tam yerini bul
          CMAKE_PATH=$(find $GITHUB_WORKSPACE -name "CMakeLists.txt" | head -n 1)
          echo "CMake found at: $CMAKE_PATH"
          
          # 2. build.gradle dosyasını güncelle
          # Path'i düzeltiyor ve CMAKE argümanlarını mevcut bloğa ekliyor
          python3 -c "
          import re
          path = '$CMAKE_PATH'
          gradle_file = 'android/app/build.gradle'
          
          with open(gradle_file, 'r') as f:
              content = f.read()
          
          # Path'i düzelt
          content = re.sub(r'path\s+[\'\"].*?CMakeLists\.txt[\'\"]', f'path \"{path}\"', content)
          
          # CMake argümanlarını ekle/güncelle
          cmake_args = 'arguments \"-DBUILD_PRO=ON\", \"-DBUILD_EDITORS=ON\", \"-DBUILD_SURF=OFF\", \"-DBUILD_PLAYER=OFF\", \"-DBUILD_WITH_JANET=OFF\"'
          
          if 'externalNativeBuild' in content:
              # Mevcut bloğun içine ekle
              content = re.sub(r'cmake\s*\{', f'cmake {{\n                {cmake_args}', content)
          
          with open(gradle_file, 'w') as f:
              f.write(content)
          "

      - name: Prepare Assets
        run: |
          mkdir -p android/app/build/assets
          cp -r assets/* android/app/build/assets/ || true

      - name: Build APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TIC80-Pro-Editor-APK
          path: '**/app-debug.apk'
