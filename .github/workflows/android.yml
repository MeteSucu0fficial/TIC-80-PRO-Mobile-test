name: Build Android Player APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup Java Environment
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Botun en kritik uyarısı: sdkmanager yollarını PATH'e ekleyip lisansları garantiliyoruz
      - name: Install Android SDK components & accept licenses
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/tools/bin:$PATH"
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-31" "build-tools;31.0.0" "ndk;23.2.8568313" "cmake;3.22.1"

      - name: Teach CMake Where studio/system.h Is Safely
        run: |
          python3 <<'PY'
          import os
          path = 'CMakeLists.txt'
          fix_block = '\ninclude_directories(${CMAKE_CURRENT_SOURCE_DIR}/src)\n'
          if os.path.exists(path):
              content = open(path, 'r', encoding='utf-8').read()
              if fix_block not in content:
                  open(path, 'w', encoding='utf-8').write(content + fix_block)
                  print('CMake yolu güvenli bir şekilde eklendi.')
              else:
                  print('CMake yolu zaten mevcut, eklenmedi.')
          else:
              print('CMakeLists.txt bulunamadı; atlanıyor.')
          PY

      # Kaçış karakteri (backslash) hatasını bitiren üçlü tırnaklı (triple-quoted) Gradle enjeksiyonu
      - name: Inject Safe Gradle Targets
        run: |
          python3 <<'PY'
          import os, re
          path = 'android/app/build.gradle'
          if os.path.exists(path):
              content = open(path, 'r', encoding='utf-8').read()
              workspace = os.environ.get('GITHUB_WORKSPACE', '').replace('\\', '/')

              # Orijinal CMake yolunu güncelliyoruz
              content = re.sub(r'path\s+[\'\"].*?CMakeLists\.txt[\'\"]', f'path "{workspace}/CMakeLists.txt"', content)

              # Daha dar bir kontrol: sadece tic80 hedefinin zaten olup olmadığına bak
              if "targets 'tic80'" not in content and 'targets "tic80"' not in content:
                  block = """\
          android {
              defaultConfig {
                  externalNativeBuild {
                      cmake {
                          arguments '-DBUILD_PRO=OFF', '-DBUILD_EDITORS=OFF', '-DBUILD_SURF=OFF', '-DBUILD_PLAYER=ON', '-DBUILD_WITH_JANET=OFF'
                          targets 'tic80'
                      }
                  }
              }
          }
          """
                  open(path, 'w', encoding='utf-8').write(content + block)
                  print('Gradle argümanları ters eğik çizgi olmadan başarıyla eklendi.')
              else:
                  print('Gradle argümanları zaten mevcut; ekleme yapılmadı.')
          else:
              print('android/app/build.gradle bulunamadı; atlanıyor.')
          PY

      - name: Advanced Manifest & Strings Injection (ElementTree)
        run: |
          python3 <<'PY'
          import os
          from xml.etree import ElementTree as ET

          package_id = 'com.nesbox.tic'
          app_name = 'TIC-80 Player'

          if os.path.exists('assets/name.txt'):
              lines = open('assets/name.txt').read().splitlines()
              if len(lines) >= 1 and lines[0].strip(): app_name = lines[0].strip()
              if len(lines) >= 2 and lines[1].strip(): package_id = lines[1].strip()

          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
              tree = ET.parse(manifest_path)
              root = tree.getroot()
              root.set('package', package_id)

              for provider in root.findall('.//provider'):
                  auth = provider.get('{http://schemas.android.com/apk/res/android}authorities')
                  if auth and 'com.nesbox.tic' in auth:
                      provider.set('{http://schemas.android.com/apk/res/android}authorities', auth.replace('com.nesbox.tic', package_id))

              tree.write(manifest_path, encoding='utf-8', xml_declaration=True)
              print('Manifest XML yapısı güvenle güncellendi.')
          else:
              print('AndroidManifest.xml bulunamadı; atlanıyor.')

          strings_path = 'android/app/src/main/res/values/strings.xml'
          if os.path.exists(strings_path):
              tree = ET.parse(strings_path)
              for string in tree.getroot().findall('string'):
                  if string.get('name') == 'app_name':
                      string.text = app_name
              tree.write(strings_path, encoding='utf-8')
              print('Uygulama ismi güvenle strings.xml içine yazıldı.')
          else:
              print('strings.xml bulunamadı; atlanıyor.')
          PY

      - name: Inject Custom App Icon (Safe Single PNG)
        run: |
          if [ -f "assets/icon.png" ]; then
            RES_DIR="android/app/src/main/res"
            rm -f $RES_DIR/mipmap-anydpi-v26/ic_launcher.xml || true
            rm -f $RES_DIR/mipmap-anydpi-v26/ic_launcher_round.xml || true
            for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p "$RES_DIR/$dir"
              cp assets/icon.png "$RES_DIR/$dir/ic_launcher.png"
              cp assets/icon.png "$RES_DIR/$dir/ic_launcher_round.png"
            done
          fi

      - name: Prepare Assets & Embed Game (cart.tic)
        run: |
          mkdir -p build/assets
          cp -r assets/* build/assets/ || true
          mkdir -p android/app/build/assets
          cp -r assets/* android/app/build/assets/ || true

          if [ -f "assets/cart.tic" ]; then
            mkdir -p android/app/src/main/assets
            cp assets/cart.tic android/app/src/main/assets/cart.tic
            echo "Oyun (cart.tic) varlıklara başarıyla eklendi!"
          fi

      - name: Build APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace --info

      # Botun tavsiye ettiği hata ayıklama adımı (Hızlı teşhis için logları listeler)
      - name: Debug Output Triage Listing
        run: |
          echo "=== Java ve Gradle Bilgileri ==="
          echo "JAVA_HOME=$JAVA_HOME"
          cd android && ./gradlew --version || true
          echo "=== Üretilen Çıktı Klasörü Klasör Ağacı ==="
          ls -R app/build/outputs || true

      - name: Find and Upload ANY APK
        uses: actions/upload-artifact@v4
        with:
          name: TIC80-Pure-Game-APK
          path: '**/*.apk'
