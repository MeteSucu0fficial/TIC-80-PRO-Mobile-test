name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Fix CMake Path and Inject Flags
        run: |
          # 1. CMake yolunu düzelt
          sed -i "s|path '.*CMakeLists.txt'|path '$GITHUB_WORKSPACE/CMakeLists.txt'|g" android/app/build.gradle
          
          # 2. Argumentleri enjekte et (Mevcut bloğu bozmadan)
          # Eğer dosyanızda externalNativeBuild bloğu varsa, içini şu değerlerle değiştirir:
          python3 -c "
          import re
          with open('android/app/build.gradle', 'r') as f:
              content = f.read()
          
          new_cmake = '''externalNativeBuild {
                  cmake {
                      arguments '-DBUILD_PRO=ON', '-DBUILD_EDITORS=ON', '-DBUILD_WITH_JANET=OFF'
                  }
              }'''
          
          # Mevcut bloğu temizle ve yenisini yaz
          content = re.sub(r'externalNativeBuild\s*\{[^\}]*cmake\s*\{[^\}]*\}', new_cmake, content)
          
          with open('android/app/build.gradle', 'w') as f:
              f.write(content)
          "

      - name: Prepare Assets
        run: |
          mkdir -p android/app/src/main/assets
          cp -r assets/* android/app/src/main/assets/ || true

      - name: Build APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TIC80-Pro-APK
          path: android/app/build/outputs/apk/debug/*.apk
