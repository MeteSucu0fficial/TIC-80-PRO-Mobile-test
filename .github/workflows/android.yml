name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Library (CMake)
        run: |
          # Önce klasörü oluştur
          mkdir -p build/assets
          # Assetleri kopyala (Eğer assets klasörü kök dizinde duruyorsa)
          if [ -d "assets" ]; then
            cp -r assets/* build/assets/
          fi
          
          cd build
          # CMake çalışırken assetleri görmesini sağlayacak şekilde konfigüre et
          cmake -DBUILD_PRO=ON -DANDROID=ON -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DCORE_ASSETS=ON ..
          make
