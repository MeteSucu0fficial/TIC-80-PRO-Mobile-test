name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with: {submodules: recursive}
      - uses: android-actions/setup-android@v3
      
      - name: Build Library and Package
        run: |
          mkdir -p build && cd build
          cmake -DBUILD_PRO=ON -DANDROID=ON -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake ..
          make
          # Eğer bir Android projesi kök dizinde varsa paketle:
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TIC80-Final-Package
          path: |
            build/bin/
            **/build/outputs/apk/debug/*.apk
