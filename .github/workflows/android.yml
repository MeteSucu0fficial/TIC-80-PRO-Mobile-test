name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Fix Everything
        run: |
          # 1. Manifest dosyasındaki package="..." kısmını sil (Hata vermemesi için)
          sed -i '/package="com.nesbox.tic"/d' android/app/src/main/AndroidManifest.xml
          
          # 2. CMake yolunu ve derleme ayarlarını düzelt
          python3 -c "
          import os, re
          gradle_file = 'android/app/build.gradle'
          content = open(gradle_file).read()
          
          # CMake yolunu proje kök dizinine (root) işaret ediyoruz
          # Eğer dosya android klasörünün içindeyse 'android/CMakeLists.txt' yazmalısın.
          # Root'ta ise bu satır doğrudur:
          workspace = os.environ.get('GITHUB_WORKSPACE', '')
          content = re.sub(r'path\s+[\'\"].*?CMakeLists\.txt[\'\"]', f'path \"{workspace}/CMakeLists.txt\"', content)
          
          # Ayarları ekle
          config_block = '''
android {
    defaultConfig {
        externalNativeBuild {
            cmake {
                arguments \"-DBUILD_PRO=ON\", \"-DBUILD_EDITORS=ON\", \"-DBUILD_SURF=OFF\", \"-DBUILD_PLAYER=OFF\", \"-DBUILD_WITH_JANET=OFF\"
            }
        }
    }
}
'''
          open(gradle_file, 'a').write(config_block)
          "

      - name: Prepare Assets
        run: |
          mkdir -p build/assets
          cp -r assets/* build/assets/ || true
          mkdir -p android/app/build/assets
          cp -r assets/* android/app/build/assets/ || true

      - name: Build APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TIC80-Pro-Editor-APK
          path: '**/app-debug.apk'
