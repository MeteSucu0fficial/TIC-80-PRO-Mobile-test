name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Inject Build Config and Fix CMake
        run: |
          python3 -c "
          import os, re
          path = 'android/app/build.gradle'
          content = open(path).read()
          workspace = os.environ.get('GITHUB_WORKSPACE', '')
          
          content = re.sub(r'path\s+[\'\"].*?CMakeLists\.txt[\'\"]', f'path \"{workspace}/CMakeLists.txt\"', content)
          
          args = '-DBUILD_WITH_ALL=OFF\", \"-DBUILD_PRO=ON\", \"-DBUILD_EDITORS=OFF\", \"-DBUILD_SURF=OFF\", \"-DBUILD_NET=OFF\", \"-DBUILD_PLAYER=ON\", \"-DBUILD_WITH_JANET=OFF\", \"-DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON'
          
          build_config = f'''
          android {{
              defaultConfig {{
                  ndk {{ abiFilters \"arm64-v8a\" }}
                  externalNativeBuild {{
                      cmake {{ arguments \"{args}\" }}
                  }}
              }}
              buildTypes {{
                  release {{
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }}
              }}
          }}
          '''
          open(path, 'w').write(content + build_config)
          "

      - name: Wipe All Embedded Demo Carts and Swap Main.c with Local Include Fixed Player.c
        run: |
          python3 -c "
          import os, re, shutil
          
          # 1. lua.c içindeki eksik demoları temizle
          lua_path = 'src/api/lua.c'
          if os.path.exists(lua_path):
              content = open(lua_path).read()
              cleaned = re.sub(r'(#include\s+[\"\']\.\./build/assets/.*?\.dat[\"\'])', r'// \1', content)
              open(lua_path, 'w').write(cleaned)
              print('Gömülü demolar lua.c içinden temizlendi!')
          
          # 2. tic80.h dosyasını doğrudan sdl klasörüne taşıyıp main.c'yi lokal bağlama zorlama
          main_path = 'src/system/sdl/main.c'
          player_path = 'src/system/sdl/player.c'
          header_src = 'include/tic80.h'
          header_dest = 'src/system/sdl/tic80.h'
          
          # tic80.h'ı main.c'nin yanına kopyala
          if os.path.exists(header_src):
              shutil.copyfile(header_src, header_dest)
              print('tic80.h lokal klasöre kopyalandı!')
          
          if os.path.exists(player_path) and os.path.exists(main_path):
              player_content = open(player_path).read()
              
              # Artık doğrudan yanındaki dosyayı görecek şekilde yerel çağrı yapıyoruz
              fixed_content = player_content.replace('#include <tic80.h>', '#include \"tic80.h\"')
              
              open(main_path, 'w').write(fixed_content)
              print('main.c içeriği lokal tic80.h referansı ile güncellendi!')
          "

      - name: Prepare Assets
        run: |
          mkdir -p android/app/build/assets
          cp -r assets/* android/app/build/assets/ || true

      - name: Auto-Replace App Icon from Assets
        run: |
          if [ -f "assets/icon.png" ]; then
            echo "icon.png bulundu, uygulama ikonları değiştiriliyor..."
            RES_DIR="android/app/src/main/res"
            rm -f $RES_DIR/mipmap-anydpi-v26/ic_launcher.xml
            rm -f $RES_DIR/mipmap-anydpi-v26/ic_launcher_round.xml
            for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p "$RES_DIR/$dir"
              cp assets/icon.png "$RES_DIR/$dir/ic_launcher.png"
              cp assets/icon.png "$RES_DIR/$dir/ic_launcher_round.png"
            done
          fi

      - name: Auto-Change App Name from Assets
        run: |
          STRINGS_FILE="android/app/src/main/res/values/strings.xml"
          if [ -f "assets/name.txt" ]; then
            APP_NAME=$(cat assets/name.txt | tr -d '\n\r')
            echo "Uygulama ismi '$APP_NAME' olarak değiştiriliyor..."
            sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">$APP_NAME</string>|g" $STRINGS_FILE
          else
            echo "assets/name.txt bulunamadı, varsayılan isim kalacak."
          fi

      - name: Build APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TIC80-Player-APK
          path: '**/*.apk'
