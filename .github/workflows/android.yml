name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Wipe Embedded Carts and Inject Android Main Fix
        run: |
          python3 -c "
          import os, re
          
          # 1. lua.c içindeki eksik varsayılan demoları temizle (Çökmeyi engeller)
          lua_path = 'src/api/lua.c'
          if os.path.exists(lua_path):
              content = open(lua_path).read()
              cleaned = re.sub(r'(#include\s+[\"\']\.\./build/assets/.*?\.dat[\"\'])', r'// \1', content)
              open(lua_path, 'w').write(cleaned)
              
          # 2. SDL'in Android ana giriş sembolünü (SDL_main) player.c içine enjekte et
          player_path = 'src/system/sdl/player.c'
          if os.path.exists(player_path):
              content = open(player_path).read()
              if 'SDL_main' not in content:
                  content = content.replace('int main(int argc, char** argv)', '#include \"SDL_main.h\"\nint SDL_main(int argc, char** argv)')
                  open(player_path, 'w').write(content)
          "

      - name: Fix CMake Path and Inject Player Flags Safely
        run: |
          python3 -c "
          import os, re
          content = open('android/app/build.gradle').read()
          workspace = os.environ.get('GITHUB_WORKSPACE', '')
          
          # 1. Sadece dosya yolunu düzeltiyoruz (Senin çalışan kısmın)
          content = re.sub(r'path\s+[\'\"].*?CMakeLists\.txt[\'\"]', f'path \"{workspace}/CMakeLists.txt\"', content)
          
          # 2. Dosyanın EN ALTINA yeni bloğu ekliyoruz (Senin çalışan yöntemin)
          # KESİN OYUNCU AYARLARI: Editörler kapalı, sadece oyun oynatıcı aktif!
          content += '\n\nandroid {\n    defaultConfig {\n        externalNativeBuild {\n            cmake {\n                arguments \"-DBUILD_PRO=OFF\", \"-DBUILD_EDITORS=OFF\", \"-DBUILD_SURF=OFF\", \"-DBUILD_PLAYER=ON\", \"-DBUILD_WITH_JANET=OFF\"\n            }\n        }\n    }\n}\n'
          
          open('android/app/build.gradle', 'w').write(content)
          "
          echo "---- Dosyanın Son Hali (Kontrol) ----"
          tail -n 15 android/app/build.gradle

      - name: Fix AndroidManifest Package ID from name.txt
        run: |
          python3 -c "
          import os, re
          
          package_id = 'com.nesbox.tic'
          if os.path.exists('assets/name.txt'):
              lines = open('assets/name.txt').read().splitlines()
              if len(lines) >= 2 and lines[1].strip():
                  package_id = lines[1].strip()

          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              content = open(manifest_path).read()
              content = re.sub(r'package=\"[^\"]*\"', '', content)
              content = content.replace('com.nesbox.tic.documents', f'{package_id}.documents')
              content = content.replace('com.nesbox.tic.fileprovider', f'{package_id}.fileprovider')
              open(manifest_path, 'w').write(content)
          "

      - name: Inject Dynamic App Name from name.txt
        run: |
          STRINGS_FILE="android/app/src/main/res/values/strings.xml"
          if [ -f "assets/name.txt" ]; then
            APP_NAME=$(head -n 1 assets/name.txt | tr -d '\n\r')
            sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">$APP_NAME</string>|g" $STRINGS_FILE
          fi

      - name: Inject Custom App Icon (icon.png)
        run: |
          if [ -f "assets/icon.png" ]; then
            RES_DIR="android/app/src/main/res"
            # XML tabanlı eski ikonları temizle ki bizim PNG baskın gelsin
            rm -f $RES_DIR/mipmap-anydpi-v26/ic_launcher.xml || true
            rm -f $RES_DIR/mipmap-anydpi-v26/ic_launcher_round.xml || true
            for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p "$RES_DIR/$dir"
              cp assets/icon.png "$RES_DIR/$dir/ic_launcher.png"
              cp assets/icon.png "$RES_DIR/$dir/ic_launcher_round.png"
            done
          fi

      - name: Prepare Assets & Inject Gömülü Oyun (cart.tic)
        run: |
          # 1. Klasörleri emniyete alıyoruz
          mkdir -p build/assets
          mkdir -p android/app/build/assets
          
          # 2. assets klasöründeki her şeyi kopyala
          cp -r assets/* build/assets/ || true
          cp -r assets/* android/app/build/assets/ || true
          
          # 3. KESİN ÇÖZÜM: Eğer assets içinde cart.tic varsa, bunu TIC-80'in Android'de
          # otomatik açtığı dahili ana klasöre (assets/) 'cart.tic' adıyla gömüyoruz.
          if [ -f "assets/cart.tic" ]; then
            mkdir -p android/app/src/main/assets
            cp assets/cart.tic android/app/src/main/assets/cart.tic
            echo "Oyun (cart.tic) uygulamanın kalbine gömüldü!"
          fi

      - name: Build APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Find and Upload ANY APK
        uses: actions/upload-artifact@v4
        with:
          name: TIC80-Custom-Player-APK
          path: '**/*.apk'
