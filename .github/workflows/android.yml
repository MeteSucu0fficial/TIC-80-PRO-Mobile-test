name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          submodules: recursive  # Önemli kısım burası!

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build with CMake
        run: |
          mkdir -p build/assets
          mkdir -p build/linux
          cp tic80.desktop.in build/linux/
          cp -r assets/* build/assets/
          cd build
          cmake -DBUILD_PRO=ON -DANDROID=ON -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake ..
          make
          # Eğer make package bir komutsa, bu şekilde olmalı. 
          # Eğer hata verirse bu satırı silip sadece make ile devam et.
          make package
          
      - name: Upload APK/Library
        uses: actions/upload-artifact@v4
        with:
          name: TIC80-Build-Output
          path: build/  # Burası derlenen her şeyi paketleyip sana sunar
