name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Inject CMake Flags
        run: |
          python3 -c "
          import os
          # build.gradle dosyasını oku
          with open('android/app/build.gradle', 'r') as f:
              content = f.read()
          
          # CMake argümanlarını içeren bloğu, defaultConfig içerisine inject ediyoruz
          # BUILD_EDITORS=ON olduğundan emin oluyoruz
          cmake_block = '''
          externalNativeBuild {
              cmake {
                  arguments '-DBUILD_PRO=ON', '-DBUILD_EDITORS=ON', '-DBUILD_WITH_JANET=OFF'
                  cppFlags '-frtti -fexceptions'
              }
          }
          '''
          
          # defaultConfig bloğunun içine ekle
          if 'defaultConfig {' in content:
              content = content.replace('defaultConfig {', 'defaultConfig {' + cmake_block)
          
          with open('android/app/build.gradle', 'w') as f:
              f.write(content)
          "

      - name: Prepare Assets
        run: |
          mkdir -p build/assets
          cp -r assets/* build/assets/ || true
          mkdir -p android/app/build/assets
          cp -r assets/* android/app/build/assets/ || true

      - name: Build APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          # Önbelleği temizleyerek derle ki değişiklikler işlensin
          ./gradlew clean assembleDebug --stacktrace

      - name: Find and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TIC80-Pro-APK
          path: 'android/app/build/outputs/apk/debug/*.apk'
        run: |
          mkdir -p build/assets
          cp -r assets/* build/assets/ || true
          mkdir -p android/app/build/assets
          cp -r assets/* android/app/build/assets/ || true

      - name: Build APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Find and Upload ANY APK
        uses: actions/upload-artifact@v4
        with:
          name: TIC80-Pro-APK
          path: '**/*.apk'
