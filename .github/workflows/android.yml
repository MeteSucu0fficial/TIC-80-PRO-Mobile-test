name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Wipe Embedded Carts and Inject Android Main Fix
        run: |
          python3 -c "
          import os, re
          
          # 1. lua.c içindeki eksik demoları temizle
          lua_path = 'src/api/lua.c'
          if os.path.exists(lua_path):
              content = open(lua_path).read()
              cleaned = re.sub(r'(#include\s+[\"\']\.\./build/assets/.*?\.dat[\"\'])', r'// \1', content)
              open(lua_path, 'w').write(cleaned)
              
          # 2. SDL'in Android ana giriş sembolünü (SDL_main) player.c içine enjekte et
          player_path = 'src/system/sdl/player.c'
          if os.path.exists(player_path):
              content = open(player_path).read()
              if 'SDL_main' not in content:
                  content = content.replace('int main(int argc, char** argv)', '#include \"SDL_main.h\"\nint SDL_main(int argc, char** argv)')
                  open(player_path, 'w').write(content)
          "

      - name: Hard Rewrite player-sdl Target & Force Linker Flags
        run: |
          python3 -c "
          import os
          path = 'CMakeLists.txt'
          if os.path.exists(path):
              content = open(path).read()
              
              # Hedefi kütüphaneye çevir
              content = content.replace('add_executable(player-sdl', 'add_library(player-sdl SHARED')
              
              linker_override = '''
              
              if(ANDROID)
                  set_target_properties(player-sdl PROPERTIES 
                      OUTPUT_NAME \"tic80\"
                      LINK_FLAGS \"-shared -Wl,--no-undefined -Wl,--entry=SDL_main\"
                      SUFFIX \".so\"
                  )
              endif()
              '''
              open(path, 'w').write(content + linker_override)
              print('Linker kuralları kilitlendi!')
          "

      - name: Pure Player C++ Build via CMake
        run: |
          NDK_PATH="${ANDROID_HOME}/ndk/23.2.8568313"
          if [ ! -d "$NDK_PATH" ]; then
            NDK_PATH=$(find $ANDROID_HOME/ndk -maxdepth 1 -mindepth 1 -type d | head -n 1)
          fi
          
          echo "Kullanılan NDK: $NDK_PATH"
          
          mkdir -p build_android && cd build_android
          
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_LD=lld \
            -DBUILD_WITH_ALL=OFF \
            -DBUILD_PRO=OFF \
            -DBUILD_EDITORS=OFF \
            -DBUILD_SURF=OFF \
            -DBUILD_NET=OFF \
            -DBUILD_PLAYER=ON \
            -DBUILD_WITH_JANET=OFF \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
          
          make -j$(nproc) player-sdl
          
          # CRITICAL FIX: main altındaki o eksik olan kutsal klasörü biz oluşturuyoruz!
          TARGET_JNI_DIR="../android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$TARGET_JNI_DIR"
          
          # Derlenen .so kütüphanelerini doğrudan bu taze yuvaya kopyala
          find . -name "*.so" -exec cp {} "$TARGET_JNI_DIR/" \;
          
          # Çift isim korumasını bu ana klasöre de mühürle
          cp "$TARGET_JNI_DIR/libtic80.so" "$TARGET_JNI_DIR/libplayer-sdl.so" || true
          
          echo "Kütüphaneler manuel oluşturulan jniLibs klasörüne başarıyla yerleşti:"
          ls -la "$TARGET_JNI_DIR/"

      - name: Overwrite build.gradle dynamically from assets/name.txt
        run: |
          python3 -c "
          import os
          
          package_id = 'com.nesbox.tic'
          if os.path.exists('assets/name.txt'):
              lines = open('assets/name.txt').read().splitlines()
              if len(lines) >= 2 and lines[1].strip():
                  package_id = lines[1].strip()

          clean_gradle = f'''
          plugins {{
              id 'com.android.application'
          }}

          android {{
              namespace 'com.nesbox.tic'
              compileSdk 34

              defaultConfig {{
                  applicationId '{package_id}'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
                  ndk {{
                      abiFilters 'arm64-v8a'
                  }}
              }}

              sourceSets {{
                  main {{
                      # Doğrudan oluşturduğumuz standart jniLibs klasörünü dinletiyoruz
                      jniLibs.srcDirs = ['src/main/jniLibs']
                  }}
              }}

              buildTypes {{
                  release {{
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }}
              }}
          }}

          dependencies {{
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }}
          '''
          open('android/app/build.gradle', 'w').write(clean_gradle)
          print('build.gradle taze jniLibs yoluyla senkronize edildi!')
          "

      - name: Inject AndroidX Properties Fix
        run: |
          echo -e "android.useAndroidX=true\nandroid.enableJetifier=true" > android/gradle.properties

      - name: Fix AndroidManifest Package & Authorities
        run: |
          python3 -c "
          import os, re
          
          package_id = 'com.nesbox.tic'
          if os.path.exists('assets/name.txt'):
              lines = open('assets/name.txt').read().splitlines()
              if len(lines) >= 2 and lines[1].strip():
                  package_id = lines[1].strip()

          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              content = open(manifest_path).read()
              content = re.sub(r'package=\"[^\"]*\"', '', content)
              content = content.replace('com.nesbox.tic.documents', f'{package_id}.documents')
              content = content.replace('com.nesbox.tic.fileprovider', f'{package_id}.fileprovider')
              open(manifest_path, 'w').write(content)
              print('AndroidManifest sterilize edildi!')
          "

      - name: Prepare Assets
        run: |
          mkdir -p android/app/build/assets
          cp -r assets/* android/app/build/assets/ || true

      - name: Auto-Replace App Icon from Assets
        run: |
          if [ -f "assets/icon.png" ]; then
            RES_DIR="android/app/src/main/res"
            rm -f $RES_DIR/mipmap-anydpi-v26/ic_launcher.xml || true
            rm -f $RES_DIR/mipmap-anydpi-v26/ic_launcher_round.xml || true
            for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p "$RES_DIR/$dir"
              cp assets/icon.png "$RES_DIR/$dir/ic_launcher.png"
              cp assets/icon.png "$RES_DIR/$dir/ic_launcher_round.png"
            done
          fi

      - name: Auto-Change App Name from Assets
        run: |
          STRINGS_FILE="android/app/src/main/res/values/strings.xml"
          if [ -f "assets/name.txt" ]; then
            APP_NAME=$(head -n 1 assets/name.txt | tr -d '\n\r')
            sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">$APP_NAME</string>|g" $STRINGS_FILE
          fi

      - name: Build APK (Packaging Only)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TIC80-Player-APK
          path: '**/*.apk'
