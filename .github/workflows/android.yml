name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Wipe All Embedded Demo Carts and Neutralize Main.c
        run: |
          python3 -c "
          import os, re
          
          # 1. lua.c içindeki eksik demoları temizle
          lua_path = 'src/api/lua.c'
          if os.path.exists(lua_path):
              content = open(lua_path).read()
              cleaned = re.sub(r'(#include\s+[\"\']\.\./build/assets/.*?\.dat[\"\'])', r'// \1', content)
              open(lua_path, 'w').write(cleaned)
          
          # 2. main.c'yi sembolik bir koda çevir
          main_path = 'src/system/sdl/main.c'
          if os.path.exists(main_path):
              open(main_path, 'w').write('int tic80_main_dummy(void) { return 0; }')
          "

      - name: Manual C++ Build via CMake (Independent from Gradle)
        run: |
          # NDK yolunu dinamik olarak kesinleştiriyoruz
          NDK_PATH="${ANDROID_HOME}/ndk/23.2.8568313"
          if [ ! -d "$NDK_PATH" ]; then
            NDK_PATH=$(find $ANDROID_HOME/ndk -maxdepth 1 -mindepth 1 -type d | head -n 1)
          fi
          
          echo "Kullanılan NDK: $NDK_PATH"
          
          mkdir -p build_android && cd build_android
          
          # Standart Android Toolchain ile doğrudan LLD'yi zorlayarak derleme başlatıyoruz
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_LD=lld \
            -DBUILD_WITH_ALL=OFF \
            -DBUILD_PRO=ON \
            -DBUILD_EDITORS=OFF \
            -DBUILD_SURF=OFF \
            -DBUILD_NET=OFF \
            -DBUILD_PLAYER=ON \
            -DBUILD_WITH_JANET=OFF \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
          
          # Hedefleri tek tek elle çağırmak yerine bağımlılıkları CMake'e bırakıp genel derleme yapıyoruz
          make -j$(nproc)
          
          # Derlenen tüm .so ve .a kütüphanelerini Gradle'ın paketleme dizinine taşıyoruz
          mkdir -p ../android/app/src/main/jniLibs/arm64-v8a
          find bin/ -name "*.so" -exec cp {} ../android/app/src/main/jniLibs/arm64-v8a/ \;
          find lib/ -name "*.a" -exec cp {} ../android/app/src/main/jniLibs/arm64-v8a/ \;

      - name: Strip Native Debugging Elements from build.gradle
        run: |
          python3 -c "
          path = 'android/app/build.gradle'
          content = open(path).read()
          
          # Gradle'ın içeride otomatik C++ derleme tetiklemesini TAMAMEN siliyoruz
          import re
          content = re.sub(r'externalNativeBuild\s*\{.*?\}', '', content, flags=re.DOTALL)
          
          # Temiz defaultConfig ayarını ekle (Sadece jniLibs'i paketleyecek)
          build_config = '''
          android {
              defaultConfig {
                  ndk { abiFilters 'arm64-v8a' }
              }
              buildTypes {
                  release {
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }
          '''
          open(path, 'w').write(content + build_config)
          "

      - name: Prepare Assets
        run: |
          mkdir -p android/app/build/assets
          cp -r assets/* android/app/build/assets/ || true

      - name: Auto-Replace App Icon from Assets
        run: |
          if [ -f "assets/icon.png" ]; then
            RES_DIR="android/app/src/main/res"
            rm -f $RES_DIR/mipmap-anydpi-v26/ic_launcher.xml
            rm -f $RES_DIR/mipmap-anydpi-v26/ic_launcher_round.xml
            for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p "$RES_DIR/$dir"
              cp assets/icon.png "$RES_DIR/$dir/ic_launcher.png"
              cp assets/icon.png "$RES_DIR/$dir/ic_launcher_round.png"
            done
          fi

      - name: Auto-Change App Name from Assets
        run: |
          STRINGS_FILE="android/app/src/main/res/values/strings.xml"
          if [ -f "assets/name.txt" ]; then
            APP_NAME=$(cat assets/name.txt | tr -d '\n\r')
            sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">$APP_NAME</string>|g" $STRINGS_FILE
          fi

      - name: Build APK (Packaging Only)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TIC80-Player-APK
          path: '**/*.apk'
