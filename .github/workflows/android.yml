name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          submodules: recursive  # Önemli kısım burası!

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build with CMake
        run: |
          # Klasörleri hazırla
          mkdir -p build/assets
          mkdir -p build/linux
          cp tic80.desktop.in build/linux/
          
          # Assets klasöründeki her şeyi build/assets içine kopyala
          cp -r assets/* build/assets/
          
          # Derlemeye geç
          cd build
          cmake -DBUILD_PRO=ON -DANDROID=ON -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake ..
          make
