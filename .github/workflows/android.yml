name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Fix CMake Path and Inject Flags
        run: |
          python3 -c "
          import os, re
          # 1. Dosyayı oku
          file_path = 'android/app/build.gradle'
          content = open(file_path).read()
          workspace = os.environ.get('GITHUB_WORKSPACE', '')
          
          # 2. CMake yolunu düzelt
          content = re.sub(r'path\s+[\'\"].*?CMakeLists\.txt[\'\"]', f'path \"{workspace}/CMakeLists.txt\"', content)
          
          # 3. Ayarları dosyanın sonuna ekle (Böylece diğer ayarları ezmeden birleştirilir)
          # BUILD_EDITORS=ON: Editörleri derler
          # BUILD_SURF=OFF: O oyun oynatma arayüzünü devre dışı bırakır
          # BUILD_PLAYER=OFF: Sadece oynatıcı modunu kapatır
          # BUILD_WITH_JANET=OFF: Derleme hatası veren Janet modülünü kapatır
          config_block = '''

          android {
                defaultConfig {
              externalNativeBuild {
            cmake {
                arguments \"-DBUILD_PRO=ON\", \"-DBUILD_EDITORS=ON\", \"-DBUILD_SURF=OFF\", \"-DBUILD_PLAYER=OFF\", \"-DBUILD_WITH_JANET=OFF\"
            }
                    }
                       }
                      }
               '''
          open(file_path, 'a').write(config_block)
          "

      - name: Prepare Assets
        run: |
          mkdir -p build/assets
          cp -r assets/* build/assets/ || true
          mkdir -p android/app/build/assets
          cp -r assets/* android/app/build/assets/ || true

      - name: Build APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TIC80-Pro-Editor-APK
          path: '**/app-debug.apk'
